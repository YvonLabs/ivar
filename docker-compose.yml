services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "7331:7331"
    env_file:
      - path: .env
        required: false
    volumes:
      - ivar_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7331/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ivar_data:
